name: Baby Respiration Monitor
version: "0.3.4"
slug: baby_respiration
description: Experimental camera breathing-motion monitor — a secondary monitor, never a medical or life-safety device
url: https://github.com/aitjcize/baby-breath-ha
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8080
panel_icon: mdi:lungs
panel_title: Baby Respiration
services:
  - mqtt:want
options:
  log_level: info
  processing_fps: 5
  min_bpm: 15
  max_bpm: 90
  minimum_confidence: 55
  no_breath_timeout: 12
  presence_detection: true
  minimum_signal_rms: 0.001
  low_rate_threshold_bpm: 20
  mqtt_base_topic: baby_respiration
  mqtt_discovery_prefix: homeassistant
schema:
  log_level: list(debug|info|warning|error)
  processing_fps: int(5,15)
  min_bpm: int(6,60)
  max_bpm: int(20,120)
  minimum_confidence: int(0,100)
  no_breath_timeout: int(5,120)
  presence_detection: bool
  minimum_signal_rms: float(0.0002,0.02)
  low_rate_threshold_bpm: int(0,60)
  mqtt_base_topic: str
  mqtt_discovery_prefix: str
