configuration:
  log_level:
    name: Log level
    description: Verbosity of the add-on log.
  processing_fps:
    name: Processing frame rate
    description: Frames per second analyzed for motion; CPU scales linearly with it. 4 is enough for the default 90 BPM band (needs to stay above twice the maximum breathing rate in Hz); use 5+ if you raise max_bpm.
  target_processing_width:
    name: Processing width
    description: Video is downscaled to this width before analysis; CPU scales with its square (320 -> 256 saves about a third). Lower widths also shrink the measured motion amplitudes.
  min_bpm:
    name: Minimum breathing rate
    description: Lower bound of the breathing band in breaths per minute.
  max_bpm:
    name: Maximum breathing rate
    description: Upper bound of the breathing band in breaths per minute.
  minimum_confidence:
    name: Minimum confidence
    description: Signal-quality score (0-100) required before motion counts as a breathing signal.
  no_breath_timeout:
    name: No-breathing timeout
    description: Seconds a calibrated, observable region must show no periodic motion before the state becomes NO_BREATHING_SIGNAL.
  presence_detection:
    name: Presence detection
    description: Pause monitoring when the crib is confirmed empty (pickup event followed by full-frame scans finding no breathing). Turn off to always treat the crib as occupied.
  minimum_signal_rms:
    name: Minimum signal amplitude
    description: Band-passed motion amplitude (pixels RMS) required before the signal counts as observable. Camera-distance dependent - lower it if a genuine breathing waveform with good SNR is rejected as too faint.
  low_rate_threshold_bpm:
    name: Low breathing-rate threshold
    description: Turns on binary_sensor.baby_breathing_rate_low when the measured rate sits below this (breaths/min). Must be above the minimum breathing rate to ever trigger; 0 disables. Build your own notification on the sensor in Home Assistant.
  detection_hold_seconds:
    name: Detection hold
    description: Once calibrated breathing is established, brief signal dropouts keep reporting it for this many seconds instead of flapping to unavailable. Alarms are never delayed by the hold. 0 disables.
  mqtt_base_topic:
    name: MQTT base topic
    description: Topic prefix for state and availability messages.
  mqtt_discovery_prefix:
    name: MQTT discovery prefix
    description: Home Assistant MQTT discovery prefix. Leave at homeassistant unless you changed it in Home Assistant.
