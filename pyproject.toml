[project]
name = "baby-breath-ha"
version = "0.1.0"
description = "Experimental local video respiration signal detector with Home Assistant MQTT discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "paho-mqtt>=2.1,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.14,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.uv]
package = false
