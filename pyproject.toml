[project]
name = "baby-breath-ha"
version = "0.3.14"
description = "Experimental local video respiration signal detector with Home Assistant MQTT discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.6,<5",
    "paho-mqtt>=2.1,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.10,<2",
]

[project.scripts]
baby-respiration = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baby_respiration/app"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["baby_respiration"]
